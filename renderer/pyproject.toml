[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "adashell-renderer"
version = "0.1.0"
description = "Standalone Adaptive Shell GL viewer fastpath runtime."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "MIT AND Apache-2.0" }
authors = [{ name = "Zhaorong Wang" }]
dependencies = [
  "numpy==2.2.6",
  "pillow>=10.4",
  "drjit==1.3.1",
  "torch==2.11.0+cu128",
  "trimesh>=4.6",
  "typing-extensions>=4.10",
  "rich>=13.7",
  "tqdm>=4.67.3",
  "python-optix==1.0.0",
  "tinycudann==2.0",
  "cupy-cuda12x==14.0.1",
  "ninja>=1.13,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6.0",
  "mypy>=1.11",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]
viewer-gl = [
  "glfw>=2.8",
  "PyOpenGL>=3.1",
  "imgui[glfw]>=2.0",
]

[project.scripts]
adashell-env-check = "adashell_renderer.env_check:main"
adashell-viewer-gl = "adashell_renderer.viewer_gl:main"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]
python-optix = { path = "dist/wheels/python_optix-1.0.0-cp310-cp310-win_amd64.whl" }
tinycudann = { path = "dist/wheels/tinycudann-2.0-cp310-cp310-win_amd64.whl" }

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
build-constraint-dependencies = [
  "setuptools<82",
]
no-build-isolation-package = [
  "tinycudann",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/adashell_renderer"]
